services:
  qdrant:
    image: qdrant/qdrant
    container_name: medhelper_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:6333/collections || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [ core ]

  postgres:
    image: postgres:16
    container_name: medhelper_pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medhelper}
      POSTGRES_USER: ${POSTGRES_USER:-meduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medpass}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ core ]

  minio:
    image: minio/minio:latest
    container_name: medhelper_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "mc alias set local http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [ core ]

  redis:
    image: redis:7
    container_name: medhelper_redis
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [ core ]

networks:
  core:

volumes:
  pg_data:
  redis_data:
  qdrant_storage:
  minio_data:
  static_data:
  media_data:
