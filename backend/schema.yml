openapi: 3.0.3
info:
  title: Project Med API
  version: 1.0.0
  description: Automated workstation for the doctor on duty
paths:
  /api/v0/auth/login/:
    post:
      operationId: auth_login_create
      description: Принимает имя пользователя и пароль. При успешной аутентификации
        создаёт серверную сессию и возвращает минимальные данные пользователя.
      summary: Вход в систему (создание сессии)
      tags:
      - Аутентификация
      - Пользователи
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimalUser'
          description: ''
        '400':
          description: Ошибки валидации входных данных
  /api/v0/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Завершает серверную сессию текущего пользователя. Операция идемпотентна:
        если пользователь не был аутентифицирован, также возвращается 204.'
      summary: Выход из системы (уничтожение сессии)
      tags:
      - Аутентификация
      - Пользователи
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: Сессия уничтожена (или отсутствовала)
  /api/v0/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Создаёт нового пользователя по переданным данным. Пароль сохраняется в хешированном виде.

        Аутентификация после регистрации не выполняется автоматически — используйте эндпоинт логина.
      summary: Регистрация пользователя
      tags:
      - Аутентификация
      - Пользователи
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimalUser'
          description: ''
        '400':
          description: Ошибки валидации входных данных
  /api/v0/document/:
    get:
      operationId: v0_document_list
      description: Возвращает список загруженных документов, отсортированных по дате
        создания (DESC).
      summary: Список документов
      parameters:
      - in: query
        name: search
        schema:
          type: string
        description: (опц.) Поиск по title/source (если добавите фильтрацию)
      tags:
      - Documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentOut'
          description: ''
    post:
      operationId: v0_document_create
      description: Загружает файл (PDF/DOCX/...), создаёт запись и ставит в очередь
        пайплайн парсинга/индексации.
      summary: Загрузить документ
      tags:
      - Documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
            examples:
              ЗагрузкаPDF:
                value:
                  title: КР ХОБЛ
                  source: upload
                  language: ru
                summary: Загрузка PDF
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
              examples:
                ЗагрузкаPDF:
                  value:
                    title: КР ХОБЛ
                    source: upload
                    language: ru
                  summary: Загрузка PDF
          description: ''
  /api/v0/document/{id}/:
    get:
      operationId: v0_document_retrieve
      summary: Получить документ
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Медицинский документ.
        required: true
      tags:
      - Documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
          description: ''
  /api/v0/document/{id}/purge/:
    delete:
      operationId: v0_document_purge_destroy
      description: Удаляет документ из БД и все связанные точки из Qdrant.
      summary: Удалить документ и его эмбеддинги
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Медицинский документ.
        required: true
      tags:
      - Documents
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v0/document/{id}/reindex/:
    post:
      operationId: v0_document_reindex_create
      description: Повторно запускает пайплайн парсинга/чанкинга/эмбеддингов/апсерта
        в Qdrant.
      summary: Переиндексировать документ
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Медицинский документ.
        required: true
      tags:
      - Documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentOut'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v0/search/:
    get:
      operationId: v0_search_list
      description: Ищет релевантные чанки по запросу `q`. `mode=vector` — чисто векторный
        поиск, `mode=hybrid` — гибридный (вектор + полнотекст, если настроен индекс).
        По умолчанию результаты ограничены документами текущего пользователя.
      summary: Поиск по эмбеддингам (vector/hybrid) в Qdrant
      parameters:
      - in: query
        name: doc_id
        schema:
          type: integer
        description: (опц.) Фильтр по конкретному документу
      - in: query
        name: k
        schema:
          type: integer
          default: 5
        description: Количество результатов (top-k)
      - in: query
        name: mode
        schema:
          type: string
          default: vector
        description: 'Режим поиска: vector | hybrid'
      - in: query
        name: q
        schema:
          type: string
        description: Поисковый запрос
        required: true
      - in: query
        name: section
        schema:
          type: string
        description: (опц.) Фильтр по названию/части названия раздела (payload.section)
      tags:
      - Search
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResponse'
              examples:
                ПримерЗапроса:
                  value:
                  - q: Противопоказания ингаляционных ГКС
                    mode: vector
                    k: 5
                  summary: Пример запроса
          description: ''
  /api/v0/test_chat_api/:
    post:
      operationId: v0_test_chat_api_create
      description: |-
        /api/chat/  (POST → create)

        Настраиваемые query-параметры:
            mode     – 'vector' | 'hybrid'  (по умолчанию 'vector')
            k        – int, количество фрагментов CONTEXT (по умолчанию 5)
            doc_id   – int | None, фильтр документа
            section  – str | None, фильтр секции/главы
      summary: Unified chat completions (clinical & generic)
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            examples:
              SimpleRequest:
                value:
                  messages:
                  - role: user
                    content: Какова доза статинов при высоком риске ИБС?
                  stream: false
                summary: Simple request
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
            text/event-stream:
              schema:
                type: string
          description: Полный ответ LLM при «stream = false»
  /api/v0/users/me/:
    get:
      operationId: users_me_retrieve
      description: |-
        Возвращает подробные данные текущего аутентифицированного пользователя.

        Требуется активная сессия (cookie) или другая совместимая схема аутентификации.
      summary: Текущий пользователь
      tags:
      - Пользователи
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v0/users/me/minimal/:
    get:
      operationId: users_me_minimal_retrieve
      description: |-
        Возвращает минимальный набор данных текущего аутентифицированного пользователя.

        Требуется активная сессия (cookie) или другая совместимая схема аутентификации.
      summary: Текущий пользователь (минимально)
      tags:
      - Пользователи
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimalUser'
          description: ''
components:
  schemas:
    ChatMessage:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        content:
          type: string
      required:
      - content
      - role
    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        params:
          type: object
          additionalProperties: {}
          description: Любые параметры, поддерживаемые моделью (temperature, top_p
            …)
      required:
      - messages
    ChatResponse:
      type: object
      properties:
        answer:
          type: string
          description: Полный ответ LLM — возвращается, если stream=false
      required:
      - answer
    DocumentOut:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 512
        file:
          type: string
          format: uri
        source:
          type: string
          maxLength: 128
        content_type:
          type: string
          maxLength: 100
        language:
          type: string
          maxLength: 16
        status:
          $ref: '#/components/schemas/StatusEnum'
        error:
          type: string
        meta: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        owner:
          type: integer
          title: Владелец
      required:
      - created_at
      - file
      - id
      - owner
    DocumentUpload:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 512
        file:
          type: string
          format: uri
        source:
          type: string
          maxLength: 128
        language:
          type: string
          maxLength: 16
      required:
      - file
      - id
    Login:
      type: object
      description: Простой сериализатор логина по username и password.
      properties:
        username:
          type: string
          title: Имя пользователя
        password:
          type: string
          writeOnly: true
          title: Пароль
      required:
      - password
      - username
    MinimalUser:
      type: object
      description: |-
        Минимальный сериализатор пользователя для отображения основных атрибутов.

        Назначение:
        - Используется там, где нужен краткий профиль пользователя без служебных полей.
        - Все поля только для чтения, чтобы не допускать записи через этот сериализатор.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Имя пользователя
        first_name:
          type: string
          readOnly: true
          title: Имя
        last_name:
          type: string
          readOnly: true
          title: Фамилия
        patronymic:
          type: string
          readOnly: true
          title: Отчество
      required:
      - first_name
      - id
      - last_name
      - patronymic
      - username
    ModeEnum:
      enum:
      - vector
      - hybrid
      type: string
      description: |-
        * `vector` - vector
        * `hybrid` - hybrid
    Register:
      type: object
      description: |-
        Сериализатор регистрации пользователя.

        Ожидаемые входные поля:
        - username: строка, обязательна
        - password: строка, обязательна (write-only)
        - first_name, last_name, patronymic: необязательные строки
        - position: первичный ключ существующей должности (обязателен)

        На выходе не содержит поле `password`.
      properties:
        username:
          type: string
          title: Имя пользователя
          maxLength: 128
        password:
          type: string
          writeOnly: true
          title: Пароль
          maxLength: 128
        first_name:
          type: string
          title: Имя
          maxLength: 100
        last_name:
          type: string
          title: Фамилия
          maxLength: 100
        patronymic:
          type: string
          title: Отчество
          maxLength: 100
        position:
          type: integer
          title: Должность
      required:
      - password
      - position
      - username
    RoleEnum:
      enum:
      - system
      - user
      - assistant
      type: string
      description: |-
        * `system` - system
        * `user` - user
        * `assistant` - assistant
    SearchHit:
      type: object
      properties:
        score:
          type: number
          format: double
        doc_id:
          type: integer
        owner_id:
          type: integer
        idx:
          type: integer
        section:
          type: string
        page_from:
          type: integer
          nullable: true
        page_to:
          type: integer
          nullable: true
        text:
          type: string
      required:
      - doc_id
      - idx
      - page_from
      - page_to
      - score
      - section
      - text
    SearchResponse:
      type: object
      properties:
        q:
          type: string
        mode:
          $ref: '#/components/schemas/ModeEnum'
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
      required:
      - mode
      - q
      - results
    StatusEnum:
      enum:
      - UPLOADED
      - PARSED
      - INDEXED
      - FAILED
      type: string
      description: |-
        * `UPLOADED` - Uploaded
        * `PARSED` - Parsed
        * `INDEXED` - Indexed
        * `FAILED` - Failed
    User:
      type: object
      description: |-
        Сериализатор для представления основных полей пользователя.

        Примечания:
        - Поле `position` отдаётся как первичный ключ связанной модели (по умолчанию
          поведения DRF для ForeignKey). При необходимости можно заменить на
          вложенный сериализатор или строковое представление.
        - Дополнительно отдаем «похожим образом» отдельные поля `position_id` и
          `position_name`, получая их из связанной модели `Position`.
        - Поле `avatar` будет сериализовано как относительный путь/URL к файлу.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Имя пользователя
        first_name:
          type: string
          readOnly: true
          title: Имя
        last_name:
          type: string
          readOnly: true
          title: Фамилия
        patronymic:
          type: string
          readOnly: true
          title: Отчество
        position:
          type: integer
          readOnly: true
          title: Должность
        position_id:
          type: integer
          readOnly: true
        position_name:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания аккаунта
        is_active:
          type: boolean
          readOnly: true
          title: Активный
        is_staff:
          type: boolean
          readOnly: true
          title: Staff
        avatar:
          type: string
          format: uri
          readOnly: true
          nullable: true
          title: Аватар
      required:
      - avatar
      - date_joined
      - first_name
      - id
      - is_active
      - is_staff
      - last_name
      - patronymic
      - position
      - position_id
      - position_name
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
