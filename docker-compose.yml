services:
  backend:
    container_name: medhelper_backend
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    command: uv run gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8001
    restart: unless-stopped
    volumes:
#      - ./backend:/app
      - static_data:/app/staticfiles
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_INSTANCE_ADDRESS=minio:9000
      - SERVER_BACKEND_IP_ADDRESS=127.0.0.1
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GIGACHAT_API_KEY=${GIGACHAT_API_KEY}
      - LOCAL_LLM_API=${LOCAL_LLM_API}
      - LLM_PROVIDER=${LLM_PROVIDER}
    networks: [ core ]

  celery_worker:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    command: uv run celery -A config.celery_app worker --loglevel=info
    depends_on:
      - redis
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_INSTANCE_ADDRESS=minio:9000
      - OMP_NUM_THREADS=1
    networks: [ core ]

  celery_beat:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    command: uv run celery -A config.celery_app beat --loglevel=info
    depends_on:
      - redis
      - celery_worker
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - OMP_NUM_THREADS=1
    networks: [ core ]

  qdrant:
    image: qdrant/qdrant
    container_name: medhelper_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:6333/collections || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [ core ]

  postgres:
    image: postgres:16
    container_name: medhelper_pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medhelper}
      POSTGRES_USER: ${POSTGRES_USER:-meduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medpass}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ core ]

  minio:
    image: minio/minio:latest
    container_name: medhelper_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "mc alias set local http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [ core ]

  redis:
    image: redis:7
    container_name: medhelper_redis
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [ core ]

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile-backend
    container_name: medhelper_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/static:ro
    depends_on:
      - backend
    networks: [ core ]

networks:
  core:

volumes:
  pg_data:
  redis_data:
  qdrant_storage:
  minio_data:
  static_data:
  media_data:
